[package]
name = "qbook"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Terminal reader for EPUB/text with synchronised translation switching"
license = "MIT"
repository = "https://github.com/axstiz/Qbook"

[features]
default = ["translate", "svg"]
translate = ["dep:ureq", "dep:serde_json"]
svg = ["dep:resvg"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
dirs = "7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
quick-xml = "0.42"
ratatui = "0.30"
resvg = { version = "0.45", default-features = false, features = ["text", "system-fonts", "raster-images"], optional = true }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1", optional = true }
thiserror = "2"
toml = "1.1.6"
unicode-segmentation = "1"
unicode-width = "0.2"
ureq = { version = "2", default-features = false, optional = true }
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
